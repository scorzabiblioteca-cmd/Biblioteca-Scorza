plugins { id 'com.android.application' }

android {
    namespace 'com.biblioscorza.webapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.biblioscorza.webapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "WEB_URL", "\"https://biblioteca-scorza.vercel.app/login\""
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
