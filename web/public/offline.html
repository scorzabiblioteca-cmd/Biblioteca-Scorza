<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2a5cb8">
    <title>Sin conexión | BiblioScorza</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #f7f9fc; color: #172b4d; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 28rem; padding: 2rem; border: 1px solid #e6ecf4; border-radius: 1rem; background: #fff; box-shadow: 0 12px 32px #0f172a12; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      button { margin-top: 1rem; border: 0; border-radius: .75rem; padding: .75rem 1rem; background: #2a5cb8; color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>No hay conexión a internet</h1>
      <p>BiblioScorza necesita conexión para consultar y actualizar la información de la biblioteca.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
